name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest

    # MySQL de verdade para o teste de integracao do pacote armazenamento
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: raiz
          MYSQL_DATABASE: jarvis
          MYSQL_USER: jarvis
          MYSQL_PASSWORD: jarvis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -praiz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          lcSaid=$(gofmt -l .)
          if [ -n "$lcSaid" ]; then echo "arquivos sem gofmt:"; echo "$lcSaid"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test (unitarios + integracao)
        env:
          JARVIS_TEST_DSN: root:raiz@tcp(127.0.0.1:3306)/jarvis?parseTime=true&charset=utf8mb4&loc=Local
        run: go test -race -count=1 -cover ./...

  imagem:
    name: Imagem Docker (deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mesma imagem que o Render constroi: quebrou aqui, quebraria no deploy
      - run: docker build -t jarvis .

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
